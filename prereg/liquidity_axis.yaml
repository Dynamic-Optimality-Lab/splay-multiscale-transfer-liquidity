version: v0.4.1
mathematical_class:
  form: (rho_ZIG, rho_DOUBLE)
  range:
  - 0
  - 12
  bound_note: upper bound 12 covers the frozen ladder max (ROT(6) = (6,12)); WP-2 implementation repair of latent 0..8 vs ladder inconsistency (recorded in Path WP-2 entry)
  symmetric_double: true
  root_noevent: 0
  normalization: ZIG-L/R -> ZIG class; orientation retained in trace
subfamilies:
  FLAT(r): (r,r)
  ROT(r): (r,2r)
discovery_ladder:
- FLAT-1..6
- ROT-1..6
ladder_extension_rule: r=7+ via versioned ladder extension, never a new axis
operator: T5_{P,rho}(L,m,ev) = iterate T5_{P,1} rho(ev) times; eligibleLatentCount
  gating
forbidden_dependencies:
- n
- tree_identity
- state_id
- cycle_id
- history_index
- future_key
- candidate_residual
- bellman_value
- holdout_membership
- support_id
- required_amount
- would_otherwise_fail
